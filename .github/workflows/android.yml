name: Android SDK

on:
  push:
    paths:
      - 'android-sdk/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-sdk/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android-sdk/build/reports/tests/

  instrumented-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Without this, every instrumented-tests run cold-downloads the
      # ~130 MB Gradle distribution from services.gradle.org (which
      # redirects to GitHub Releases). GitHub Releases occasionally
      # returns 504s under load, breaking the job for reasons unrelated
      # to our code. The cache is workflow-wide, so unit-tests above
      # has already populated it by the time this job runs.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install stub-relay dependencies
        working-directory: tools/stub-relay
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Start stub-relay
        working-directory: tools/stub-relay
        run: |
          nohup .venv/bin/python server.py > /tmp/relay.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/cdl/session/t/complete \
                -X POST -H 'Content-Type: application/json' -d '{}' > /dev/null; then
              echo "relay up"
              exit 0
            fi
            sleep 1
          done
          echo "relay failed to start"
          cat /tmp/relay.log
          exit 1

      - name: Run connectedAndroidTest on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android-sdk
          # adb reverse so the AVD's `localhost:8787` reaches the host-side
          # stub-relay started in the previous step. Without this, the
          # fullFlowAgainstStubRelay test fails with ConnectException —
          # AVD's localhost is the AVD's own loopback, not the host's.
          # Equivalent to the USB-device setup documented in
          # CDLSessionE2ETest.kt. Previously the test used 10.0.2.2 which
          # only worked on emulator; switching to localhost + reverse
          # makes it portable across emulator and USB device.
          script: |
            adb reverse tcp:8787 tcp:8787
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: android-sdk/build/reports/androidTests/
