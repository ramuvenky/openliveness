distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
# Gradle wrapper defaults networkTimeout to 10s, which intermittently
# fails CI on a cache miss (the gradle-8.10 zip is ~130 MB). Five
# minutes is enough headroom for any GitHub runner + services.gradle.org
# hiccup without being long enough to mask a truly broken network.
networkTimeout=300000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
