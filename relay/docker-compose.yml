version: '3.8'
services:
  relay:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY_PATH=/keys/relay-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/relay-public.pem
      - RELAY_BASE_URL=localhost
      - NODE_ENV=development
      - HARDWARE_ATTESTATION=stub
      - INTEGRITY_NONCE_SECRET=dev-secret-change-in-production
    volumes:
      - ./keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    # N-d: bind Redis to loopback only. The relay container reaches it over
    # the compose network; the previous "6379:6379" exposed Redis on every
    # host interface, which has caused real "steal my unauthenticated
    # Redis" incidents on dev laptops. Operators who need host access can
    # override this mapping.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
