version: '3.8'
services:
  relay:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY_PATH=/keys/relay-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/relay-public.pem
      # LAN IP for cross-device testing (phone → Mac over Wi-Fi) belongs
      # in a developer-local .env file, NOT this compose file. Default to
      # localhost so the committed template is safe to run anywhere and
      # a stale IP from one laptop can't follow the repo to another.
      - RELAY_BASE_URL=${RELAY_BASE_URL:-localhost}
      - NODE_ENV=${NODE_ENV:-development}
      - HARDWARE_ATTESTATION=${HARDWARE_ATTESTATION:-stub}
      # Required: boot refuses an empty secret or the well-known
      # placeholder in production, so this must come from .env or shell
      # env. Compose fails fast with a readable error if it's missing.
      - INTEGRITY_NONCE_SECRET=${INTEGRITY_NONCE_SECRET:?INTEGRITY_NONCE_SECRET must be set — copy .env.example to .env, then openssl rand -hex 32}
      # Allowlist of relying_party values permitted to submit stub_mode:true
      # attestations. Empty in production. Operator sets via .env for CI RPs.
      - STUB_MODE_RP_ALLOWLIST=${STUB_MODE_RP_ALLOWLIST:-}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    # N-d: bind Redis to loopback only. The relay container reaches it over
    # the compose network; the previous "6379:6379" exposed Redis on every
    # host interface, which has caused real "steal my unauthenticated
    # Redis" incidents on dev laptops. Operators who need host access can
    # override this mapping.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
